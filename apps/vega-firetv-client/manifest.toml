schema-version = 1
# Targets the requested Vega 2.x loader; Vega 4.x packaging needs its newer runtime.

[package]
title = "AegisOmni Caretaking & Co-Viewing OS"
id = "com.aegisomni.vegatv"
version = "1.0.0"

[components]
[[components.interactive]]
id = "com.aegisomni.vegatv.main"
runtime-module = "/com.amazon.kepler.keplerscript.runtime.loader_2@IKeplerScript_2_0"
launch-type = "singleton"
categories = ["com.amazon.category.main", "com.amazon.category.leanback"]

[wants]
[[wants.service]]
id = "com.amazon.media.server"
[[wants.service]]
id = "com.amazon.kepler.contentlauncher"
